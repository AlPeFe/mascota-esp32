; Mascota de escritorio para la placa ESP32-2432S028 ("Cheap Yellow Display")
; Pantalla 2.8" 240x320 + táctil resistivo XPT2046.
;
; Hay dos variantes de esta placa que solo se distinguen por el chip de la pantalla:
;   - cyd      -> ILI9341 (la más común)          pio run -e cyd -t upload
;   - cyd2usb  -> ST7789 (algunas con USB-C)      pio run -e cyd2usb -t upload
; Si con "cyd" la imagen sale rara o con colores raros, prueba "cyd2usb".

[platformio]
default_envs = cyd

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -O2
    ; --- Configuración de TFT_eSPI (sustituye a su User_Setup.h) ---
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000

[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1
    -DDEFAULT_INVERT=0

[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DDEFAULT_INVERT=1
